name: Build and Sign F-cam APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Official Apktool jar (bundles its own aapt2).
      # Your old run used "2.7.0-dirty", which could not extract its aapt2
      # and fell back to the system one that rejects names starting with $.
      - name: Install Apktool
        run: |
          mkdir -p "$HOME/tools"
          curl -fL -o "$HOME/tools/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          printf '#!/bin/sh\nexec java -jar "%s/tools/apktool.jar" "$@"\n' "$HOME" > "$HOME/tools/apktool"
          chmod +x "$HOME/tools/apktool"
          echo "$HOME/tools" >> "$GITHUB_PATH"

      # Fixes: resource 'drawable/$avd_hide_password__0' has invalid entry name.
      # Renames every res file starting with "$" and updates all references
      # (layouts, drawables, values, public.xml) so nothing is left dangling.
      - name: Fix resource names starting with $
        run: |
          python3 - <<'PY'
          import os, re

          res = "res"
          renames = {}  # old resource name -> new resource name

          for root, dirs, files in os.walk(res):
              for f in files:
                  if f.startswith("$"):
                      old = f
                      new = "dollar_" + f[1:]
                      os.rename(os.path.join(root, old), os.path.join(root, new))
                      renames[os.path.splitext(old)[0]] = os.path.splitext(new)[0]

          print(f"Renamed {len(renames)} files")

          # longest names first so shorter names never clobber longer ones
          ordered = sorted(renames.items(), key=lambda kv: -len(kv[0]))

          for root, dirs, files in os.walk(res):
              for f in files:
                  if not f.endswith(".xml"):
                      continue
                  p = os.path.join(root, f)
                  try:
                      s = open(p, encoding="utf-8").read()
                  except UnicodeDecodeError:
                      continue
                  orig = s
                  for old, new in ordered:
                      s = s.replace(old, new)
                  if s != orig:
                      open(p, "w", encoding="utf-8").write(s)

          # Any leftover "$" resource names inside value files
          for root, dirs, files in os.walk(res):
              for f in files:
                  if f.endswith(".xml"):
                      p = os.path.join(root, f)
                      try:
                          s = open(p, encoding="utf-8").read()
                      except UnicodeDecodeError:
                          continue
                      s2 = re.sub(r'name="\$', 'name="dollar_', s)
                      if s2 != s:
                          open(p, "w", encoding="utf-8").write(s2)
          PY

      # Removes public.xml entries that point at resource files that don't exist
      # (fixes: "no definition for declared symbol ...drawable/dollar_avd_...").
      - name: Remove dangling public.xml entries
        run: |
          python3 - <<'PY'
          import os, re

          res = "res"
          file_types = {"drawable","layout","anim","animator","xml","raw","color",
                        "mipmap","menu","interpolator","transition","font","navigation"}
          defined = set()
          for d in os.listdir(res):
              t = d.split("-")[0]
              if t in file_types and os.path.isdir(os.path.join(res, d)):
                  for f in os.listdir(os.path.join(res, d)):
                      defined.add((t, os.path.splitext(f)[0]))

          p = os.path.join(res, "values", "public.xml")
          if os.path.exists(p):
              out, removed = [], 0
              for line in open(p, encoding="utf-8"):
                  m = re.search(r'<public\s+type="(\w+)"\s+name="([^"]+)"', line)
                  if m and m.group(1) in file_types and m.group(2).startswith(("dollar_", "$")) \
                          and (m.group(1), m.group(2)) not in defined:
                      removed += 1
                      continue
                  out.append(line)
              open(p, "w", encoding="utf-8").write("".join(out))
              print(f"Removed {removed} dangling public.xml entries")
          PY

      # Android 14 palette colors missing from Apktool's bundled framework.
      - name: Replace missing android:color palette references
        run: |
          python3 - <<'PY'
          import os
          colors = {
            "Teal_700":"#00796B","Teal_800":"#00695C","Indigo_700":"#303F9F",
            "Indigo_800":"#283593","Blue_700":"#1976D2","Blue_800":"#1565C0",
            "Purple_700":"#7B1FA2","Purple_800":"#6A1B9A","Pink_700":"#C2185B",
            "Pink_800":"#AD1457","Red_700":"#D32F2F","Red_800":"#C62828",
          }
          for root, _, files in os.walk("res"):
              if not os.path.basename(root).startswith("values"):
                  continue
              for f in files:
                  if not f.endswith(".xml"):
                      continue
                  p = os.path.join(root, f)
                  s = open(p, encoding="utf-8").read()
                  o = s
                  for k, v in colors.items():
                      s = s.replace("@android:color/" + k, v)
                  if s != o:
                      open(p, "w", encoding="utf-8").write(s)
                      print("patched", p)
          PY

      - name: Build Unsigned APK
        run: |
          mkdir -p dist
          apktool b . -o dist/unsigned.apk

      - name: Zipalign and Sign APK with Test Key
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          keytool -genkeypair -keystore test.jks -storepass android -keypass android \
            -alias test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Test, O=Test, C=US"
          "$BT/zipalign" -f -p 4 dist/unsigned.apk dist/aligned.apk
          "$BT/apksigner" sign --ks test.jks --ks-pass pass:android --key-pass pass:android \
            --out dist/F-cam-signed.apk dist/aligned.apk
          "$BT/apksigner" verify dist/F-cam-signed.apk

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: F-cam-signed-apk
          path: dist/F-cam-signed.apk
