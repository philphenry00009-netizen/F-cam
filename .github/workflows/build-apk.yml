name: Build and Sign F-cam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Apktool and Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y apktool android-sdk-build-tools

    - name: Safely Purge Animation Files Only (Keep XMLs Intact)
      run: |
        python3 -c "
        import os

        print('--- Safely deleting problematic animation files ---')
        deleted_count = 0
        for root, dirs, files in os.walk('res'):
            for f in files:
                # Only delete the specific animation/checkbox files that trigger aapt2 errors
                if f.startswith(('avd_', 'm3_avd_', 'mtrl_checkbox_', 'follow_focus')) or '$' in f:
                    path = os.path.join(root, f)
                    try:
                        os.remove(path)
                        print(f'Deleted: {path}')
                        deleted_count += 1
                    except Exception as e:
                        print(f'Failed to delete {path}: {e}')
        print(f'Total animation files purged: {deleted_count}')
        "

    - name: Build Unsigned APK
      run: |
        mkdir -p dist
        apktool b . -o dist/F-cam-unsigned.apk --use-aapt2

    - name: Sign APK with Test Key
      run: |
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -passin pass:android -passout pass:android
        zipalign -v -p 4 dist/F-cam-unsigned.apk dist/F-cam-aligned.apk
        apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android dist/F-cam-aligned.apk
        cp dist/F-cam-aligned.apk dist/F-cam-release.apk

    - name: Upload Built APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: F-cam-Signed-APK
        path: dist/F-cam-release.apk
