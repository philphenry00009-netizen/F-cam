name: Build and Sign F-cam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Apktool and Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y apktool android-sdk-build-tools

    - name: Complete Resource Clean (Purge Files & Clean public.xml)
      run: |
        python3 -c "
        import os, re

        print('--- STEP 1: Deleting physical resource files starting with $ or containing dollar signs ---')
        deleted_count = 0
        for root, dirs, files in os.walk('res'):
            for f in files:
                if '$' in f or 'avd_' in f or 'mtrl_checkbox' in f:
                    file_path = os.path.join(root, f)
                    try:
                        os.remove(file_path)
                        deleted_count += 1
                    except Exception as e:
                        pass
        print(f'Deleted {deleted_count} problematic XML/image files.')

        print('--- STEP 2: Cleaning XML references in values files ---')
        cleaned_entries = 0
        for root, dirs, files in os.walk('res/values'):
            for f in files:
                if f.endswith('.xml'):
                    xml_path = os.path.join(root, f)
                    with open(xml_path, 'r', encoding='utf-8', errors='ignore') as fp:
                        content = fp.read()
                    
                    # Remove any line that defines or references resources containing '$'
                    new_lines = []
                    for line in content.splitlines():
                        if '$' in line or 'avd_hide_password' in line or 'avd_show_password' in line:
                            cleaned_entries += 1
                            continue
                        new_lines.append(line)
                    
                    with open(xml_path, 'w', encoding='utf-8') as fp:
                        fp.write('\n'.join(new_lines))

        print(f'Purged {cleaned_entries} invalid XML entries from values files.')
        "

    - name: Build Unsigned APK
      run: |
        mkdir -p dist
        apktool b . -o dist/F-cam-unsigned.apk --use-aapt2

    - name: Sign APK with Test Key
      run: |
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -passin pass:android -passout pass:android
        zipalign -v -p 4 dist/F-cam-unsigned.apk dist/F-cam-aligned.apk
        apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android dist/F-cam-aligned.apk
        cp dist/F-cam-aligned.apk dist/F-cam-release.apk

    - name: Upload Built APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: F-cam-Signed-APK
        path: dist/F-cam-release.apk
