cd /workspaces/BeamerA/fcam-source

# 1. Rename files containing '$' in res/drawable to remove invalid characters
find res/drawable -name '*\$*' | while read -r file; do
  newfile=$(echo "$file" | sed 's/\$/_/' | sed 's/__/_/g')
  mv "$file" "$newfile"
done

# 2. Update workflow to force aapt2 and build properly
cat << 'EOF' > .github/workflows/build-apk.yml
name: Build and Sign F-cam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Build Tools & Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool aapt

      - name: Build Unsigned APK
        run: |
          mkdir -p dist
          # Force apktool to use aapt/aapt2 and bypass prebuilt binary bugs
          apktool b . -o dist/F-cam-unsigned.apk --use-aapt2

      - name: Generate Debug Keystore & Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -passin pass:android -passout pass:android
          BUILD_TOOLS_VERSION=$(ls -1 $ANDROID_HOME/build-tools | sort -r | head -n 1)
          APKSIGNER=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner
          $APKSIGNER sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out dist/F-cam-signed.apk dist/F-cam-unsigned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: F-cam-Signed-APK
          path: dist/F-cam-signed.apk
EOF

# 3. Commit and push
git add res/ .github/workflows/build-apk.yml
git commit -m "fix: clean invalid resource names and use aapt2 for build"
git push origin main
