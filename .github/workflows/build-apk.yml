name: Build APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build with Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          apktool b . -o fcam-patched.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fcam-apk
          path: fcam-patched.apk
