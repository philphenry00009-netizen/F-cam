name: Build and Sign F-cam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Apktool and Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y apktool android-sdk-build-tools

    - name: Aggressive Workspace Scan and Destroy ($ files)
      run: |
        python3 -c "
        import os

        print('--- Scanning entire repository workspace for dollar-sign files ---')
        deleted_count = 0
        for root, dirs, files in os.walk('.'):
            # Skip git metadata folder
            if '.git' in root:
                continue
            for f in files:
                if '$' in f:
                    path = os.path.join(root, f)
                    try:
                        os.remove(path)
                        print(f'DELETED: {path}')
                        deleted_count += 1
                    except Exception as e:
                        print(f'FAILED TO DELETE {path}: {e}')
                        
        print(f'Total illegal files wiped out: {deleted_count}')
        "

    - name: Build Unsigned APK
      run: |
        mkdir -p dist
        apktool b . -o dist/F-cam-unsigned.apk --use-aapt2

    - name: Sign APK with Test Key
      run: |
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -passin pass:android -passout pass:android
        zipalign -v -p 4 dist/F-cam-unsigned.apk dist/F-cam-aligned.apk
        apksigner sign --ks debug.keystore --ks-pass pass:android --key-press pass:android dist/F-cam-aligned.apk
        cp dist/F-cam-aligned.apk dist/F-cam-release.apk

    - name: Upload Built APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: F-cam-Signed-APK
        path: dist/F-cam-release.apk
